server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Let app set CSP via middleware
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    charset utf-8;

    # ── Cloudflare / CDN real IP ──
    # Restore the visitor's real IP address from Cloudflare's headers
    # so that rate-limiting, logging, and geolocation see the correct IP.
    # Cloudflare IP ranges — replace with the current list from
    # https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6
    # for tighter security. 0.0.0.0/0 works when the server is 100% behind
    # Cloudflare with no direct internet exposure.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Deny access to dotfiles
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ (\.env|\.git|composer\.json|composer\.lock|artisan)$ {
        deny all;
        return 404;
    }

    # Static assets — cache aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
        try_files $uri /index.php?$query_string;
    }

    # Storage files
    location /storage/ {
        try_files $uri /index.php?$query_string;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend static build output
    location /dist/ {
        alias /var/www/html/public/dist/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API requests — rate limited and proxied to PHP-FPM
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        try_files $uri /index.php?$query_string;

        # Micro-cache: cache GET responses for 5s in Nginx so repeated
        # requests (e.g. rapid refreshes) don't hit PHP-FPM at all.
        # This works alongside the Laravel Cache-Control headers.
        proxy_cache api_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 5s;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM passthrough
    location ~ \.php$ {
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;

        fastcgi_read_timeout 120;
        fastcgi_send_timeout 120;
    }

    # Deny other PHP file execution
    location ~ \.(phar|phpt|phtml)$ {
        deny all;
        return 404;
    }
}
