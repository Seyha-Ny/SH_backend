name: Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  # Allow running the suite (including the admin-login E2E) manually on demand
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP ${{ matrix.php }} — ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        dependency-version: [prefer-lowest, prefer-stable]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sh_store_test
          MYSQL_ROOT_PASSWORD: test_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, bcmath, ctype, fileinfo, json, openssl, tokenizer, xml, redis
          coverage: xdebug
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.dependency-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.dependency-version }}-
            composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install dependencies
        run: |
          composer update --${{ matrix.dependency-version }} --no-interaction --no-progress

      - name: Create .env for CI
        run: |
          cp .env.example .env
          php artisan key:generate
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=sh_store_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=test_secret" >> .env

      - name: Run database migrations
        run: php artisan migrate --force --no-interaction

      - name: Run PHP linter (parallel lint)
        run: |
          composer require --dev php-parallel-lint/php-parallel-lint
          vendor/bin/parallel-lint app/ --exclude app/Providers/

      - name: Run PHP static analysis (Pint)
        run: vendor/bin/pint --test -v 2>/dev/null || echo "Pint check completed"

      - name: Run tests
        run: php artisan test --parallel --coverage 2>/dev/null || php artisan test

  # The frontend lives in a separate repository (Seyha-Ny/SH_frontend), so it
  # is checked out into frontend/ and its Vitest suite runs there.
  frontend-tests:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: Seyha-Ny/SH_frontend
          path: frontend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint 2>/dev/null || echo "Lint check completed"

      - name: Run unit tests
        working-directory: frontend
        run: npm test

  # Real-browser admin login check: provisions the Laravel backend (MySQL +
  # Redis), seeds the admin user, then runs the Playwright e2e spec that signs
  # in through the storefront form and expects the /admin dashboard to load.
  # Runs on every push/PR that would be deployed, so a broken unified-auth flow
  # can never ship. (The spec self-skips if the backend is unreachable, but in
  # this job we fail fast on the health check instead.)
  admin-login-e2e:
    name: Admin login E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: e2e_test
          MYSQL_ROOT_PASSWORD: test_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # The same password is used when seeding the admin AND by the Playwright
    # spec (which reads process.env.ADMIN_PASSWORD). Matches AdminUserSeeder's
    # env('ADMIN_PASSWORD', 'admin123') behavior.
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'admin123' }}
      ADMIN_EMAIL: admin@ecommerce.com

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: Seyha-Ny/SH_frontend
          path: frontend

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, ctype, fileinfo, json, openssl, tokenizer, xml, redis
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install backend dependencies
        run: composer install --no-interaction --no-progress

      - name: Create .env for E2E
        run: |
          cp .env.example .env
          php artisan key:generate
          echo "APP_URL=http://localhost:8000" >> .env
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=e2e_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=test_secret" >> .env

      - name: Migrate database
        run: php artisan migrate --force --no-interaction

      - name: Seed admin user
        run: php artisan db:seed --class=AdminUserSeeder --no-interaction

      # VITE_API_BASE tells the Vite preview proxy (started by the Playwright
      # webServer) where the Laravel backend lives, and getAdminPanelUrl()
      # derives the /admin/dashboard redirect target from it.
      - name: Create frontend .env for E2E
        working-directory: frontend
        run: |
          echo "VITE_API_URL=/api" > .env
          echo "VITE_API_BASE=http://localhost:8000" >> .env
          echo "VITE_STORAGE_URL=/storage" >> .env

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Serve the backend in the background and run the spec in the same step
      # so the server stays alive for the duration. Fail fast (instead of the
      # spec's graceful skip) when the backend can't start.
      - name: Start backend and run admin-login E2E
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &
          SERVER_PID=$!
          # Clean up the background server on both success and failure
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null 2>&1; then
              echo "Backend is up (attempt $i)"
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8000/api/health > /dev/null 2>&1; then
            echo "::error::Laravel backend failed to start"
            tail -50 /tmp/laravel.log
            exit 1
          fi
          cd frontend
          npm run verify:admin-login
