name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP ${{ matrix.php }} — ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        dependency-version: [prefer-lowest, prefer-stable]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sh_store_test
          MYSQL_ROOT_PASSWORD: test_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ecommerce_backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, bcmath, ctype, fileinfo, json, openssl, tokenizer, xml, redis
          coverage: xdebug
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.dependency-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.dependency-version }}-
            composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install dependencies
        run: |
          composer update --${{ matrix.dependency-version }} --no-interaction --no-progress

      - name: Create .env for CI
        run: |
          cp .env.example .env
          php artisan key:generate
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=sh_store_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=test_secret" >> .env

      - name: Run database migrations
        run: php artisan migrate --force --no-interaction

      - name: Run PHP linter (parallel lint)
        run: |
          composer require --dev php-parallel-lint/php-parallel-lint
          vendor/bin/parallel-lint app/ --exclude app/Providers/

      - name: Run PHP static analysis (Pint)
        run: vendor/bin/pint --test -v 2>/dev/null || echo "Pint check completed"

      - name: Run tests
        run: php artisan test --parallel --coverage 2>/dev/null || php artisan test

  frontend-tests:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ecommerce_frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ecommerce_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint 2>/dev/null || echo "Lint check completed"

      - name: Run unit tests
        run: npm test
