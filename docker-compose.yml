services:
  # ---------- Backend (PHP-FPM) ----------
  backend:
    build:
      context: ..
      dockerfile: ecommerce_backend/Dockerfile
      target: backend
    image: zenora_backend
    container_name: zenora_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - storage_data:/var/www/html/storage
      - ./docker/php.ini:/usr/local/etc/php/conf.d/app.ini:ro
      - ./docker/php-opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-https://example.com}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-zenora}
      DB_USERNAME: ${DB_USERNAME:-zenora}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      MAIL_MAILER: ${MAIL_MAILER:-log}
      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      QUEUE_WORKER: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - zenora_network

  # ---------- Nginx ----------
  nginx:
    build:
      context: ..
      dockerfile: ecommerce_backend/Dockerfile
      target: nginx
    image: zenora_nginx
    container_name: zenora_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - storage_data:/var/www/html/storage:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - zenora_network

  # ---------- MySQL ----------
  mysql:
    image: mysql:8.4
    container_name: zenora_mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-zenora}
      MYSQL_USER: ${DB_USERNAME:-zenora}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - zenora_network

  # ---------- Redis ----------
  redis:
    image: redis:7.4-alpine
    container_name: zenora_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zenora_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local

networks:
  zenora_network:
    driver: bridge
